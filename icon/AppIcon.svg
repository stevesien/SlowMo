<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E6E6E9"/>
    </linearGradient>
    <clipPath id="dome">
      <path d="M 292 600 C 292 400, 724 400, 724 600 Z"/>
    </clipPath>
    <clipPath id="tile">
      <rect x="100" y="100" width="824" height="824" rx="186"/>
    </clipPath>
  </defs>

  <!-- Tile shadow, tile, hairline edge -->
  <rect x="100" y="114" width="824" height="824" rx="186" fill="#000000" opacity="0.14"/>
  <rect x="100" y="106" width="824" height="824" rx="186" fill="#000000" opacity="0.08"/>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/>
  <rect x="101.5" y="101.5" width="821" height="821" rx="184.5" fill="none" stroke="#000000" stroke-opacity="0.08" stroke-width="3"/>

  <g clip-path="url(#tile)">
  <g transform="translate(505 540) scale(1.13) translate(-548 -585)">

    <!-- Slow-motion trail: faint grey copies of the shell -->
    <path d="M 292 600 C 292 400, 724 400, 724 600 Z" transform="translate(-96 0)" fill="#1C1C1E" opacity="0.06"/>
    <path d="M 292 600 C 292 400, 724 400, 724 600 Z" transform="translate(-48 0)" fill="#1C1C1E" opacity="0.12"/>

    <g fill="#1C1C1E">
      <!-- Tail -->
      <path d="M 300 612 Q 262 620 248 646 Q 286 642 312 634 Z"/>
      <!-- Legs -->
      <rect x="332" y="606" width="76" height="98" rx="34"/>
      <rect x="430" y="612" width="70" height="90" rx="32"/>
      <rect x="546" y="612" width="70" height="90" rx="32"/>
      <rect x="632" y="606" width="76" height="98" rx="34"/>
      <!-- Neck and head -->
      <path d="M 686 612 C 716 566, 756 540, 792 538 L 818 604 C 784 616, 740 628, 696 636 Z"/>
      <ellipse cx="810" cy="536" rx="78" ry="68"/>
      <!-- Shell dome -->
      <path d="M 292 600 C 292 400, 724 400, 724 600 Z"/>
      <!-- Shell rim -->
      <rect x="284" y="606" width="448" height="36" rx="18"/>
    </g>

    <!-- Eye -->
    <circle cx="834" cy="518" r="15" fill="#FFFFFF"/>

    <!-- Scute pattern cut into the shell, plus the gap between shell and rim -->
    <g clip-path="url(#dome)" fill="none" stroke="#FFFFFF" stroke-width="13" stroke-linejoin="round" stroke-linecap="round">
      <path d="M 450 472 L 566 472 L 604 540 L 566 600 L 450 600 L 412 540 Z"/>
      <path d="M 412 540 L 300 540"/>
      <path d="M 604 540 L 716 540"/>
      <path d="M 450 472 L 426 420"/>
      <path d="M 566 472 L 590 420"/>
    </g>
    <rect x="302" y="597" width="412" height="12" rx="6" fill="#FFFFFF"/>
  </g>
  </g>
</svg>
